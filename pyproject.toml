[project]
name = "flights-optimizer"
version = "0.1.0"
description = "Multi-city flight schedule and ticket partitioning optimizer"
readme = "DESIGN.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
    "fast-flights>=3.1.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "playwright>=1.64.1",
    "pre-commit>=4.0.0",
    "pytest>=8.3.0",
    "pytest-playwright>=0.10.0",
    "ruff>=0.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
